name: Deploy GELM MUSIC LAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GELM_MUSIC_LAB

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun ci

      - name: Construir GELM MUSIC LAB
        run: bun run build

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: GELM_MUSIC_LAB/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Publicar GELM MUSIC LAB
        id: deployment
        uses: actions/deploy-pages@v4
