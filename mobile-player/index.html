<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318"><link rel="manifest" href="./manifest.webmanifest">
<title>GT-GELM · Reproductor MP3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#111318;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px}
.player{width:100%;max-width:420px;background:#1b1f27;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0007}.cover{width:100%;aspect-ratio:1;border-radius:16px;background:#2a2f3a;display:grid;place-items:center;overflow:hidden;margin-bottom:18px}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:52px;opacity:.45}
h1{margin:0;font-size:21px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{margin:6px 0 16px;color:#9aa4b2;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:#2c313c;border-radius:99px;overflow:hidden;cursor:pointer;touch-action:pan-y}.progress{height:100%;width:0;background:#4f8cff}.times{display:flex;justify-content:space-between;font-size:12px;color:#9aa4b2;margin:8px 0 18px}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}button{border:0;background:#2a2f3a;color:#fff;width:52px;height:52px;border-radius:50%;font-size:20px;cursor:pointer}#play{width:68px;height:68px;background:#4f8cff;font-size:26px}
.shuffle{margin-top:18px;width:100%;height:44px;border-radius:12px;font-size:14px;background:#232833;color:#cbd3e1}.shuffle.on{background:#4f8cff;color:#fff}.status{margin-top:14px;text-align:center;font-size:13px;color:#9aa4b2;min-height:20px}
@media(max-height:700px){.cover{width:min(45vh,100%);margin-left:auto;margin-right:auto}.player{padding:16px}}
</style></head><body>
<div class="player"><div class="cover" id="cover"><span>🎵</span></div><h1 id="titulo">Cargando música…</h1><div class="artist" id="artista"></div>
<div class="bar" id="barra"><div class="progress" id="progreso"></div></div><div class="times"><span id="tiempoActual">0:00</span><span id="tiempoTotal">0:00</span></div>
<div class="controls"><button id="anterior" aria-label="Anterior">⏮</button><button id="play" aria-label="Reproducir">▶</button><button id="siguiente" aria-label="Siguiente">⏭</button></div>
<button id="aleatorio" class="shuffle on">🔀 Modo aleatorio: activado</button><div class="status" id="estado">Leyendo catálogo…</div></div>
<audio id="audio" preload="metadata" playsinline></audio>
<script>
const $=id=>document.getElementById(id),audio=$("audio");let canciones=[],orden=[],posicion=0,aleatorio=true;
function formatoTiempo(n){if(!Number.isFinite(n))return"0:00";return Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0")}
function mezclar(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function indiceActual(){return orden[posicion]??-1}function cancionActual(){return canciones[indiceActual()]}
function crearOrden(){const actual=indiceActual();orden=canciones.map((_,i)=>i);if(aleatorio)orden=mezclar(orden);if(orden.length>1&&orden[0]===actual)[orden[0],orden[1]]=[orden[1],orden[0]]}
function media(c){if(!("mediaSession"in navigator)||!c)return;try{navigator.mediaSession.metadata=new MediaMetadata({title:c.titulo||"Sin título",artist:c.artista||"GT-GELM",album:"Guatemala, tu nombre inmortal"});navigator.mediaSession.setActionHandler("play",reproducir);navigator.mediaSession.setActionHandler("pause",()=>audio.pause());navigator.mediaSession.setActionHandler("nexttrack",siguiente);navigator.mediaSession.setActionHandler("previoustrack",anterior)}catch(e){}}
function cargarCancion(i,auto=true){if(!orden.length)return;posicion=(i+orden.length)%orden.length;const c=cancionActual();audio.src=c.archivo;audio.load();$("titulo").textContent=c.titulo||"Sin título";$("artista").textContent=c.artista||"GT-GELM";$("cover").innerHTML=c.portada?'<img src="'+c.portada+'" alt="">':"<span>🎵</span>";$("progreso").style.width="0";$("tiempoActual").textContent="0:00";$("tiempoTotal").textContent="0:00";media(c);if(auto)reproducir();else{$("play").textContent="▶";$("estado").textContent="Catálogo listo · toca reproducir"}}
function reproducir(){audio.play().then(()=>{$("play").textContent="⏸";$("estado").textContent="Reproduciendo"}).catch(()=>{$("play").textContent="▶";$("estado").textContent="Toca reproducir para iniciar el audio"})}
function siguiente(){if(!orden.length)return;let n=posicion+1;if(n>=orden.length){crearOrden();n=0}cargarCancion(n)}
function anterior(){if(!orden.length)return;if(audio.currentTime>3){audio.currentTime=0;return}cargarCancion(posicion-1)}
$("play").addEventListener("click",()=>audio.paused?reproducir():audio.pause());audio.addEventListener("play",()=>{$("play").textContent="⏸";$("estado").textContent="Reproduciendo"});audio.addEventListener("pause",()=>{$("play").textContent="▶";if(!audio.ended)$("estado").textContent="Pausado"});
$("siguiente").addEventListener("click",siguiente);$("anterior").addEventListener("click",anterior);audio.addEventListener("ended",siguiente);
$("aleatorio").addEventListener("click",()=>{aleatorio=!aleatorio;$("aleatorio").classList.toggle("on",aleatorio);$("aleatorio").textContent=aleatorio?"🔀 Modo aleatorio: activado":"🔁 Modo aleatorio: desactivado";crearOrden();posicion=0;cargarCancion(0,false)});
audio.addEventListener("timeupdate",()=>{if(audio.duration){$("progreso").style.width=(audio.currentTime/audio.duration*100)+"%";$("tiempoActual").textContent=formatoTiempo(audio.currentTime)}});
audio.addEventListener("loadedmetadata",()=>{$("tiempoTotal").textContent=formatoTiempo(audio.duration);media(cancionActual())});
$("barra").addEventListener("click",e=>{if(!Number.isFinite(audio.duration))return;const r=$("barra").getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!audio.paused)$("estado").textContent="Sonando en segundo plano"});
fetch("./musica.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("No se pudo cargar musica.json");return r.json()}).then(d=>{if(!Array.isArray(d)||!d.length)throw Error("Catálogo vacío");canciones=d.filter(c=>c.archivo&&/^https:\/\//.test(c.archivo));if(!canciones.length)throw Error("No hay MP3 válidos");crearOrden();cargarCancion(0,false);$("estado").textContent=canciones.length+" canciones listas · toca ▶"}).catch(e=>{$("titulo").textContent="Error";$("artista").textContent=e.message;$("estado").textContent="Revisa musica.json"});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
